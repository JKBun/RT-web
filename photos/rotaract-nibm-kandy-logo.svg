<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <!-- Transparent background for max adaptability -->
  <style>
    .brand-text-main {
      font-family: 'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      fill: #C01046;
      font-size: 82px;
      letter-spacing: -1.5px;
    }
    .brand-text-sub {
      font-family: 'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      fill: #C01046;
      font-size: 58px;
      letter-spacing: -0.5px;
    }
    .slogan-text {
      font-family: 'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-style: italic;
      fill: #C01046;
      font-size: 50px;
      line-height: 0.95;
      letter-spacing: 0px;
    }
  </style>

  <g transform="translate(40, 150)">
    <!-- Left Text: Rotaract NIBM Kandy -->
    <text x="0" y="-12" class="brand-text-main">Rotaract</text>
    <text x="18" y="52" class="brand-text-sub">NIBM Kandy</text>

    <!-- Rotary International Cogwheel -->
    <g transform="translate(435, 0)">
      <!-- Outer Gear Teeth (24 cogs) -->
      <g fill="#C01046">
        <!-- 24 teeth spaced 15 deg -->
        <circle cx="0" cy="0" r="68" fill="#C01046" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(15)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(30)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(45)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(60)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(75)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(90)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(105)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(120)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(135)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(150)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(165)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(180)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(195)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(210)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(225)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(240)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(255)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(270)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(285)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(300)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(315)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(330)" />
        <path d="M-8,-82 L8,-82 L7,-70 L-7,-70 Z" transform="rotate(345)" />
      </g>

      <!-- Inner rim gap -->
      <circle cx="0" cy="0" r="64" fill="#C01046" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="0" r="44" fill="#ffffff" />
      <circle cx="0" cy="0" r="41" fill="#C01046" />

      <!-- Text along arc paths for ROTARY INTERNATIONAL -->
      <path id="rotaryArcTop" d="M -36,0 A 36,36 0 0,1 36,0" fill="none" />
      <path id="rotaryArcBottom" d="M 38,0 A 38,38 0 0,1 -38,0" fill="none" />
      <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="2.5">
        <textPath href="#rotaryArcTop" startOffset="50%" text-anchor="middle">ROTARY</textPath>
      </text>
      <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8.5" fill="#ffffff" letter-spacing="1">
        <textPath href="#rotaryArcBottom" startOffset="50%" text-anchor="middle">INTERNATIONAL</textPath>
      </text>

      <!-- Center Hub & 6 Spokes -->
      <circle cx="0" cy="0" r="23" fill="#ffffff" />
      <circle cx="0" cy="0" r="21" fill="#C01046" />
      <g stroke="#ffffff" stroke-width="4">
        <line x1="0" y1="-21" x2="0" y2="21" />
        <line x1="-18.2" y1="-10.5" x2="18.2" y2="10.5" />
        <line x1="-18.2" y1="10.5" x2="18.2" y2="-10.5" />
      </g>
      <!-- Center Axle Hole & Keyway slot -->
      <circle cx="0" cy="0" r="9" fill="#ffffff" />
      <rect x="-2" y="-11" width="4" height="6" fill="#ffffff" />
      <circle cx="0" cy="0" r="6" fill="#C01046" />

      <!-- Registered symbol -->
      <text x="62" y="65" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#C01046">®</text>
    </g>

    <!-- Divider Line -->
    <line x1="535" y1="-75" x2="535" y2="65" stroke="#94A3B8" stroke-width="2.5" />

    <!-- Right Slogan Text -->
    <g transform="translate(560, 0)">
      <text x="0" y="-42" class="slogan-text">CREATE</text>
      <text x="5" y="6" class="slogan-text">LASTING</text>
      <text x="12" y="54" class="slogan-text">IMPACT</text>
    </g>
  </g>
</svg>
